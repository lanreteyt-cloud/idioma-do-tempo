<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tradutor - Idioma do Tempo</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #121212;
            color: #e0e0e0;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
        }
        .container {
            background-color: #1e1e1e;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 8px 24px rgba(0,0,0,0.5);
            width: 90%;
            max-width: 500px;
            text-align: center;
        }
        h1 {
            font-size: 24px;
            color: #d4af37;
            margin-bottom: 10px;
        }
        p {
            font-size: 14px;
            color: #888;
            margin-bottom: 20px;
        }
        textarea {
            width: 100%;
            height: 100px;
            background-color: #2a2a2a;
            color: #fff;
            border: 1px solid #444;
            border-radius: 6px;
            padding: 12px;
            font-size: 16px;
            resize: none;
            box-sizing: border-box;
            margin-bottom: 15px;
        }
        textarea:focus {
            outline: none;
            border-color: #d4af37;
        }
        .output-box {
            background-color: #2a2a2a;
            border: 1px dashed #555;
            border-radius: 6px;
            padding: 15px;
            min-height: 50px;
            font-family: monospace;
            font-size: 18px;
            color: #d4af37;
            word-break: break-all;
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>⏳ Idioma do Tempo</h1>
        <p>Digite um texto para codificá-lo no formato de relógio e números romanos:</p>
        
        <textarea id="inputText" placeholder="Digite aqui..." oninput="traduzir()"></textarea>
        
        <p style="margin-bottom: 5px; text-align: left; font-size: 12px;">Resultado codificado:</p>
        <div id="outputText" class="output-box">II:VIII . I:V . II:I . II:IV . II:III</div>
    </div>

    <script>
        function traduzir() {
            const texto = document.getElementById("inputText").value.toUpperCase();
            let resultado = [];
            
            for (let i = 0; i < texto.length; i++) {
                let codigoAscii = texto.charCodeAt(i);
                if (codigoAscii >= 65 && codigoAscii <= 90) { // A-Z
                    let posicao = codigoAscii - 65;
                    let bloco, hora;
                    
                    if (posicao < 12) {
                        bloco = "I";
                        hora = posicao + 1;
                    } else if (posicao < 24) {
                        bloco = "II";
                        hora = (posicao - 12) + 1;
                    } else {
                        bloco = "III";
                        hora = (posicao - 24) + 1;
                    }
                    resultado.append ? resultado.push(`${bloco}:${hora}`) : resultado[resultado.length] = `${bloco}:${hora}`;
                }
            }
            
            document.getElementById("outputText").innerText = resultado.length > 0 ? resultado.join(" . ") : "Aguardando texto...";
        }
    </script>

</body>
</html>
