<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="google-site-verification" content="18VIPrkEdHl-VvqBFWDzqh2cYbcmxmICrdg2-DTS8fs" />
    <title>Tradutor - Idioma do Tempo (Cronolingua)</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #121212;
            color: #e0e0e0;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
        }
        .container {
            background-color: #1e1e1e;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 8px 24px rgba(0,0,0,0.5);
            width: 90%;
            max-width: 500px;
            text-align: center;
            margin-bottom: 20px;
        }
        h1 {
            font-size: 22px;
            color: #d4af37;
            margin-bottom: 5px;
        }
        p {
            font-size: 13px;
            color: #888;
            margin-bottom: 15px;
        }
        textarea {
            width: 100%;
            height: 80px;
            background-color: #2a2a2a;
            color: #fff;
            border: 1px solid #444;
            border-radius: 6px;
            padding: 10px;
            font-size: 15px;
            resize: none;
            box-sizing: border-box;
            margin-bottom: 10px;
        }
        textarea:focus {
            outline: none;
            border-color: #d4af37;
        }
        .output-box {
            background-color: #2a2a2a;
            border: 1px dashed #555;
            border-radius: 6px;
            padding: 12px;
            min-height: 40px;
            font-family: monospace;
            font-size: 16px;
            color: #d4af37;
            word-break: break-all;
            text-align: left;
        }
    </style>
</head>
<body>

    <!-- CAIXA 1: CODIFICAR -->
    <div class="container">
        <h1>⏳ Codificar (Texto para Relógio)</h1>
        <p>Digite o texto normal (espaços viram barras /):</p>
        <textarea id="inputTexto" placeholder="Ex: Olá mundo" oninput="codificar()"></textarea>
        
        <p style="margin-bottom: 5px; text-align: left; font-size: 12px;">Resultado codificado:</p>
        <div id="outputCodigo" class="output-box">II:III . II:IX . I:L . I:IX / II:II . II:IX . II:VIII . I:E ...</div>
    </div>

    <!-- CAIXA 2: DECODIFICAR -->
    <div class="container">
        <h1>🔓 Decodificar (Relógio para Texto)</h1>
        <p>Cole o código (ex: II:VIII . I:V / ...):</p>
        <textarea id="inputCodigo" placeholder="Ex: II:VIII . I:V / II:I" oninput="decodificar()"></textarea>
        
        <p style="margin-bottom: 5px; text-align: left; font-size: 12px;">Resultado traduzido:</p>
        <div id="outputTextoDecodificado" class="output-box">Aguardando código...</div>
    </div>

    <script>
        // Função para Codificar Texto -> Relógio
        function codificar() {
            const texto = document.getElementById("inputTexto").value.toUpperCase();
            let resultado = [];
            
            for (let i = 0; i < texto.length; i++) {
                let char = texto[i];
                if (char === ' ' || char === '/') {
                    resultado.push('/');
                    continue;
                }
                
                let codigoAscii = char.charCodeAt(0);
                if (codigoAscii >= 65 && codigoAscii <= 90) { // A-Z
                    let posicao = codigoAscii - 65;
                    let bloco, hora;
                    
                    if (posicao < 12) {
                        bloco = "I";
                        hora = posicao + 1;
                    } else if (posicao < 24) {
                        bloco = "II";
                        hora = (posicao - 12) + 1;
                    } else {
                        bloco = "III";
                        hora = (posicao - 24) + 1;
                    }
                    resultado.push(`${bloco}:${hora}`);
                }
            }
            
            document.getElementById("outputCodigo").innerText = resultado.length > 0 ? resultado.join(" . ").replace(/ \. \/ \. /g, " / ") : "Aguardando texto...";
        }

        // Função para Decodificar Relógio -> Texto
        function decodificar() {
            let codigo = document.getElementById("inputCodigo").value.trim();
            if (!codigo) {
                document.getElementById("outputTextoDecodificado").innerText = "Aguardando código...";
                return;
            }

            // Normaliza espaços e divisores
            let blocos = codigo.split(/[\.\s]+/);
            let textoFinal = "";

            for (let item of blocos) {
                if (item === '/' || item === '|') {
                    textoFinal += " ";
                    continue;
                }

                let partes = item.split(":");
                if (partes.length === 2) {
                    let bloco = partes[0].toUpperCase();
                    let hora = parseInt(partes[1]);

                    let offset = -1;
                    if (bloco === "I" && hora >= 1 && hora <= 12) {
                        offset = hora - 1;
                    } else if (bloco === "II" && hora >= 1 && hora <= 12) {
                        offset = 12 + (hora - 1);
                    } else if (bloco === "III" && hora >= 1 && hora <= 2) {
                        offset = 24 + (hora - 1);
                    }

                    if (offset !== -1) {
                        textoFinal += String.fromCharCode(65 + offset);
                    }
                }
            }

            document.getElementById("outputTextoDecodificado").innerText = textoFinal || "Código inválido.";
        }
    </script>

</body>
</html>
